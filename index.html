<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn tập Sinh học Tế bào & Di truyền</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --success: #10B981;
            --success-hover: #059669;
            --error: #EF4444;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text: #1F2937;
            --text-light: #6B7280;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            padding: 30px;
            box-sizing: border-box;
            position: relative;
        }

        /* Start Screen */
        #start-screen {
            text-align: center;
        }

        #start-screen h1 {
            color: var(--primary);
            margin-bottom: 30px;
        }

        .settings {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: flex-start;
            max-width: 300px;
            margin: 0 auto 30px auto;
            background: #F9FAFB;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #E5E7EB;
        }

        .setting-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1em;
            cursor: pointer;
        }
        
        .setting-item input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* Quiz Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 15px;
        }

        .progress {
            font-weight: bold;
            color: var(--primary);
        }

        .score-board {
            font-size: 0.9em;
            color: var(--text-light);
        }

        .question {
            font-size: 1.15em;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .multi-hint {
            color: #D97706;
            font-size: 0.85em;
            font-weight: normal;
            display: block;
            margin-top: 5px;
            font-style: italic;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background-color: var(--bg);
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1em;
            line-height: 1.4;
            display: flex;
            align-items: center;
        }

        .option:hover:not(.disabled) {
            background-color: #E0E7FF;
            border-color: #A5B4FC;
        }
        
        .option.selected {
            background-color: #EEF2FF;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
        }

        .option.disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .option.correct {
            background-color: #D1FAE5 !important;
            border-color: var(--success) !important;
            color: #065F46;
        }

        .option.wrong {
            background-color: #FEE2E2 !important;
            border-color: var(--error) !important;
            color: #991B1B;
        }

        .explanation {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            background-color: #FFFBEB;
            border-left: 4px solid #F59E0B;
            display: none;
            line-height: 1.6;
        }

        .explanation h4 {
            margin: 0 0 10px 0;
            color: #B45309;
        }

        .btn-container {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 24px;
            font-size: 1.05em;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }
        
        button#btn-submit {
            background-color: var(--success);
        }
        
        button#btn-submit:hover {
            background-color: var(--success-hover);
        }

        button#btn-review {
            background-color: var(--error);
        }
        
        button#btn-review:hover {
            background-color: #B91C1C;
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        .result-screen h2 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .citation {
            font-size: 0.75em;
            color: #9CA3AF;
            vertical-align: super;
            display: none; /* Ẩn thẻ citation theo yêu cầu tinh gọn giao diện */
        }
        
        /* Hide elements by default */
        #question-screen, #result-screen {
            display: none;
        }
    </style>
</head>
<body>

<div class="quiz-container" id="quiz-app">
    <!-- Màn hình cài đặt bắt đầu -->
    <div id="start-screen">
        <h1>Ôn tập Sinh học Tế bào</h1>
        <div class="settings">
            <label class="setting-item">
                <input type="checkbox" id="shuffle-questions" checked>
                Xáo trộn thứ tự câu hỏi
            </label>
            <label class="setting-item">
                <input type="checkbox" id="shuffle-options" checked>
                Xáo trộn thứ tự đáp án
            </label>
        </div>
        <button onclick="startQuiz()">Bắt đầu làm bài ❯</button>
    </div>

    <!-- Màn hình câu hỏi -->
    <div id="question-screen">
        <div class="header">
            <div class="progress" id="progress-text">Câu 1/110</div>
            <div class="score-board">Điểm: <span id="score-text">0</span></div>
        </div>
        
        <div class="question" id="question-text">Đang tải câu hỏi...</div>
        
        <div class="options" id="options-container">
        </div>

        <div class="explanation" id="explanation-box">
            <h4>Giải thích & Đáp án:</h4>
            <p id="explanation-text"></p>
        </div>

        <div class="btn-container">
            <button id="btn-submit" onclick="submitMultiSelect()" style="display:none;">Xác nhận đáp án</button>
            <button id="btn-next" onclick="nextQuestion()" style="display:none;">Câu tiếp theo ❯</button>
        </div>
    </div>

    <!-- Màn hình kết quả -->
    <div class="result-screen" id="result-screen">
        <h2>Hoàn thành!</h2>
        <p>Số câu đúng: <strong id="final-score">0</strong> / <span id="total-questions">0</span></p>
        <p>Số câu sai: <strong id="final-wrong">0</strong></p>
        
        <div class="btn-container" style="justify-content: center; margin-top: 30px;">
            <button id="btn-restart" onclick="goToStartScreen()">Về màn hình chính</button>
            <button id="btn-review" onclick="startReview()" style="display: none;">Ôn lại các câu sai</button>
        </div>
    </div>
</div>

let currentPool = [];
let currentIndex = 0;
let score = 0;
let wrongQuestions = [];
let isReviewMode = false;
let currentSelections = new Set(); // Bộ nhớ tạm cho câu Multi-select

// DOM Elements
const screenStart = document.getElementById('start-screen');
const screenQuestion = document.getElementById('question-screen');
const screenResult = document.getElementById('result-screen');
const domQuestionText = document.getElementById('question-text');
const domOptionsContainer = document.getElementById('options-container');
const domProgressText = document.getElementById('progress-text');
const domScoreText = document.getElementById('score-text');
const domExplanationBox = document.getElementById('explanation-box');
const domExplanationText = document.getElementById('explanation-text');
const btnNext = document.getElementById('btn-next');
const btnSubmit = document.getElementById('btn-submit');

// Xáo trộn mảng ngẫu nhiên (Fisher-Yates)
function shuffleArray(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex !== 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
}

function goToStartScreen() {
    screenStart.style.display = 'block';
    screenQuestion.style.display = 'none';
    screenResult.style.display = 'none';
}

function startQuiz() {
    const shouldShuffleQuestions = document.getElementById('shuffle-questions').checked;
    const shouldShuffleOptions = document.getElementById('shuffle-options').checked;
    
    // Sao chép sâu dữ liệu gốc để không thay đổi file gốc
    currentPool = JSON.parse(JSON.stringify(originalQuestions));
    
    if (shouldShuffleOptions) {
        currentPool = currentPool.map(q => {
            let correctAnswers = Array.isArray(q.correctIndex) 
                ? q.correctIndex.map(i => q.options[i]) 
                : [q.options[q.correctIndex]];
                
            q.options = shuffleArray(q.options);
            
            if (Array.isArray(q.correctIndex)) {
                q.correctIndex = correctAnswers.map(ans => q.options.indexOf(ans));
            } else {
                q.correctIndex = q.options.indexOf(correctAnswers[0]);
            }
            return q;
        });
    }

    if (shouldShuffleQuestions) {
        currentPool = shuffleArray(currentPool);
    }
    
    isReviewMode = false;
    wrongQuestions = [];
    runQuizSession();
}

function startReview() {
    if(wrongQuestions.length === 0) return;
    isReviewMode = true;
    currentPool = [...wrongQuestions];
    runQuizSession();
}

function runQuizSession() {
    currentIndex = 0;
    score = 0;
    domScoreText.innerText = score;
    screenStart.style.display = 'none';
    screenQuestion.style.display = 'block';
    screenResult.style.display = 'none';
    loadQuestion();
}

function loadQuestion() {
    const q = currentPool[currentIndex];
    currentSelections.clear();
    
    domExplanationBox.style.display = 'none';
    btnNext.style.display = 'none';
    btnSubmit.style.display = 'none';
    domOptionsContainer.innerHTML = '';
    
    const reviewLabel = isReviewMode ? "[Chế độ Ôn Tập] " : "";
    domProgressText.innerText = `${reviewLabel}Câu ${currentIndex + 1}/${currentPool.length}`;
    
    const isMultiSelect = Array.isArray(q.correctIndex);
    const multiHint = isMultiSelect ? "<span class='multi-hint'>(Câu này có nhiều đáp án đúng. Hãy tích chọn và ấn Xác nhận)</span>" : "";
    
    domQuestionText.innerHTML = q.text + multiHint;

    q.options.forEach((opt, index) => {
        const btn = document.createElement('div');
        btn.className = 'option';
        btn.innerHTML = opt;
        btn.onclick = () => selectOption(index, btn, isMultiSelect);
        domOptionsContainer.appendChild(btn);
    });
}

function selectOption(selectedIndex, selectedElement, isMultiSelect) {
    if (isMultiSelect) {
        // Logic cho câu hỏi chọn nhiều
        if (currentSelections.has(selectedIndex)) {
            currentSelections.delete(selectedIndex);
            selectedElement.classList.remove('selected');
        } else {
            currentSelections.add(selectedIndex);
            selectedElement.classList.add('selected');
        }
        
        if (currentSelections.size > 0) {
            btnSubmit.style.display = 'block';
        } else {
            btnSubmit.style.display = 'none';
        }
    } else {
        // Logic chọn thẳng ngay 1 câu
        evaluateSingleSelect(selectedIndex, selectedElement);
    }
}

function evaluateSingleSelect(selectedIndex, selectedElement) {
    const q = currentPool[currentIndex];
    const allOptions = domOptionsContainer.children;
    
    // Khoá lựa chọn
    for(let i = 0; i < allOptions.length; i++) {
        allOptions[i].classList.add('disabled');
        allOptions[i].onclick = null;
    }

    const isCorrect = selectedIndex === q.correctIndex;

    if(isCorrect) {
        selectedElement.classList.add('correct');
        if(!isReviewMode) score++;
        domScoreText.innerText = score;
    } else {
        selectedElement.classList.add('wrong');
        allOptions[q.correctIndex].classList.add('correct');
        
        if (!isReviewMode && !wrongQuestions.find(wq => wq.id === q.id)) {
            wrongQuestions.push(q);
        }
    }

    showExplanation(q);
}

function submitMultiSelect() {
    const q = currentPool[currentIndex];
    const allOptions = domOptionsContainer.children;
    
    for(let i = 0; i < allOptions.length; i++) {
        allOptions[i].classList.add('disabled');
        allOptions[i].onclick = null;
    }
    
    btnSubmit.style.display = 'none';
    
    const correctSet = new Set(q.correctIndex);
    const isCorrect = currentSelections.size === correctSet.size && 
                      [...currentSelections].every(x => correctSet.has(x));

    if (isCorrect) {
        // Đúng hết
        currentSelections.forEach(idx => allOptions[idx].classList.add('correct'));
        if(!isReviewMode) score++;
        domScoreText.innerText = score;
    } else {
        // Highlight sai/đúng
        currentSelections.forEach(idx => {
            if(!correctSet.has(idx)) {
                allOptions[idx].classList.add('wrong');
            }
        });
        correctSet.forEach(idx => allOptions[idx].classList.add('correct'));
        
        if (!isReviewMode && !wrongQuestions.find(wq => wq.id === q.id)) {
            wrongQuestions.push(q);
        }
    }

    showExplanation(q);
}

function showExplanation(q) {
    domExplanationText.innerHTML = q.explanation;
    domExplanationBox.style.display = 'block';
    
    btnNext.style.display = 'block';
    if(currentIndex === currentPool.length - 1) {
        btnNext.innerText = 'Xem kết quả ❯';
    } else {
        btnNext.innerText = 'Câu tiếp theo ❯';
    }
}

function nextQuestion() {
    if(currentIndex < currentPool.length - 1) {
        currentIndex++;
        loadQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    screenQuestion.style.display = 'none';
    screenResult.style.display = 'block';
    
    document.getElementById('final-score').innerText = score;
    document.getElementById('total-questions').innerText = currentPool.length;
    document.getElementById('final-wrong').innerText = isReviewMode ? "0 (Đã hoàn thành ôn tập)" : wrongQuestions.length;

    const btnReviewWrapper = document.getElementById('btn-review');
    if(!isReviewMode && wrongQuestions.length > 0) {
        btnReviewWrapper.style.display = 'inline-block';
    } else {
        btnReviewWrapper.style.display = 'none';
    }
}
    // --- TÍNH NĂNG ĐIỀU KHIỂN BẰNG BÀN PHÍM ---
document.addEventListener('keydown', function(event) {
    // Chỉ kích hoạt phím tắt khi màn hình câu hỏi đang hiển thị
    if (screenQuestion.style.display === 'block') {
        
        // 1. Nhấn 1, 2, 3, 4 để chọn đáp án
        if (['1', '2', '3', '4'].includes(event.key)) {
            const index = parseInt(event.key) - 1;
            const options = domOptionsContainer.children;
            
            // Đảm bảo đáp án tồn tại và chưa bị khoá (chưa trả lời xong)
            if (options[index] && !options[index].classList.contains('disabled')) {
                options[index].click(); // Mô phỏng thao tác click chuột
            }
        }
        
        // 2. Nhấn phím Mũi tên phải (->) để sang câu tiếp theo
        if (event.key === 'ArrowRight') {
            if (btnNext.style.display !== 'none') {
                btnNext.click();
            }
        }

        // 3. Nhấn phím Enter để "Xác nhận đáp án" (câu nhiều lựa chọn) hoặc chuyển câu
        if (event.key === 'Enter') {
            if (btnSubmit.style.display !== 'none') {
                btnSubmit.click();
            } else if (btnNext.style.display !== 'none') {
                btnNext.click();
            }
        }
    }
    
    // Phím Enter ở màn hình bắt đầu để vào làm bài luôn
    if (screenStart.style.display !== 'none' && event.key === 'Enter') {
        startQuiz();
    }
});
