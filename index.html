<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn tập Sinh học Tế bào & Di truyền</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --success: #10B981;
            --error: #EF4444;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text: #1F2937;
            --text-light: #6B7280;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            padding: 30px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 15px;
        }

        .progress {
            font-weight: bold;
            color: var(--primary);
        }

        .score-board {
            font-size: 0.9em;
            color: var(--text-light);
        }

        .question {
            font-size: 1.15em;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background-color: var(--bg);
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1em;
            line-height: 1.4;
        }

        .option:hover:not(.disabled) {
            background-color: #E0E7FF;
            border-color: #A5B4FC;
        }

        .option.disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .option.correct {
            background-color: #D1FAE5;
            border-color: var(--success);
            color: #065F46;
        }

        .option.wrong {
            background-color: #FEE2E2;
            border-color: var(--error);
            color: #991B1B;
        }

        .explanation {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            background-color: #FFFBEB;
            border-left: 4px solid #F59E0B;
            display: none;
            line-height: 1.6;
        }

        .explanation h4 {
            margin: 0 0 10px 0;
            color: #B45309;
        }

        .btn-container {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
            display: none;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button#btn-review {
            background-color: var(--error);
        }
        
        button#btn-review:hover {
            background-color: #B91C1C;
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        .result-screen h2 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .citation {
            font-size: 0.75em;
            color: #9CA3AF;
            vertical-align: super;
        }
    </style>
</head>
<body>

<div class="quiz-container" id="quiz-app">
    <div id="question-screen">
        <div class="header">
            <div class="progress" id="progress-text">Câu 1/110</div>
            <div class="score-board">Điểm: <span id="score-text">0</span></div>
        </div>
        
        <div class="question" id="question-text">Đang tải câu hỏi...</div>
        
        <div class="options" id="options-container">
        </div>

        <div class="explanation" id="explanation-box">
            <h4>Giải thích & Đáp án:</h4>
            <p id="explanation-text"></p>
        </div>

        <div class="btn-container">
            <button id="btn-next" onclick="nextQuestion()">Câu tiếp theo ❯</button>
        </div>
    </div>

    <div class="result-screen" id="result-screen">
        <h2>Hoàn thành!</h2>
        <p>Số câu đúng: <strong id="final-score">0</strong> / <span id="total-questions">0</span></p>
        <p>Số câu sai: <strong id="final-wrong">0</strong></p>
        
        <div class="btn-container" style="justify-content: center; margin-top: 30px;">
            <button id="btn-restart" onclick="restartQuiz()" style="display: block;">Làm lại từ đầu</button>
            <button id="btn-review" onclick="startReview()" style="display: block;">Ôn lại các câu sai</button>
        </div>
    </div>
</div>

<script>
    const allQuestions = [
        { id: 1, text: "1. \\[H01.0078\\] Điểm giống nhau giữa tái bản ADN ở Prokaryota và Eukaryota:<span class='citation'>[cite: 2]</span>", options: ["A. Điểm khởi đầu của các sợi<span class='citation'>[cite: 2]</span>", "B. Chiều hướng tổng hợp và những đoạn ARN mồi<span class='citation'>[cite: 2]</span>", "C. Sự có mặt của các protein chuyên biệt nhằm hoạt hóa sự hoạt động của một số enzym<span class='citation'>[cite: 2]</span>", "D. Thành phần ezym tham gia<span class='citation'>[cite: 2]</span>"], correctIndex: 1, explanation: "Đáp án đúng là B<span class='citation'>[cite: 1]</span>." },
        { id: 2, text: "2. \\[H01.0080\\] Trong cơ chế kích thích:<span class='citation'>[cite: 2]</span>", options: ["A. Gen điều chỉnh luôn luôn sản xuất ra protein hoạt hóa<span class='citation'>[cite: 2]</span>", "B. Tất cả đều đúng<span class='citation'>[cite: 2]</span>", "C. Gen cấu trúc luôn luôn được mở để tổng hợp mARN<span class='citation'>[cite: 2]</span>", "D. Quá trình dịch mà, phiên mã luôn luôn được diễn ra<span class='citation'>[cite: 2]</span>"], correctIndex: 0, explanation: "Đáp án đúng là A<span class='citation'>[cite: 1]</span>." },
        { id: 3, text: "3. \\[H01.0054\\] Về các sự kiện trong kỳ đầu I của phân bào giảm nhiễm:<span class='citation'>[cite: 2]</span>", options: ["A. Các chromatid chỉ dính với nhau tại eo sơ cấp trong suốt giai đoạn của kỳ này<span class='citation'>[cite: 2]</span>", "B. Tại lưỡng trị, các chromatid chị em bắt chéo nhau để trao đổi đoạn<span class='citation'>[cite: 2]</span>", "C. Gồm 4 giai đoạn<span class='citation'>[cite: 2]</span>", "D. Giai đoạn tiếp hợp là khởi đầu cho sự trao đổi chéo<span class='citation'>[cite: 2]</span>"], correctIndex: 3, explanation: "Đáp án đúng là D<span class='citation'>[cite: 1]</span>." },
        { id: 4, text: "4. \\[H01.0055\\] Hiện tượng co nguyên sinh:<span class='citation'>[cite: 2]</span>", options: ["A. Xảy ra khi môi trường nhược trương<span class='citation'>[cite: 2]</span>", "B. Thực chất là hiện tượng tan bào<span class='citation'>[cite: 2]</span>", "C. Xảy ra khi để hiện tượng phản co nguyên sinh một thời gian chừng 25-30 phút<span class='citation'>[cite: 2]</span>", "D. Xảy ra chỉ với thực vật, không xảy ra với động vật<span class='citation'>[cite: 2]</span>"], correctIndex: 3, explanation: "Đáp án đúng là D<span class='citation'>[cite: 1]</span>." },
        { id: 5, text: "5. \\[H01.0086\\] Về các tARN:<span class='citation'>[cite: 2]</span>", options: ["A. Không có cấu tạo bậc 3<span class='citation'>[cite: 2]</span>", "B. Chiếm 50% tổng lượng ARN trong tế bào<span class='citation'>[cite: 2]</span>", "C. Cấu tạo bậc hai có vị trí gắn acid amin và vị trí nhận biết mã (đối mã)<span class='citation'>[cite: 2]</span>", "D. Là ARN duy nhất được tổng hợp từ tADN một cách đặc hiệu<span class='citation'>[cite: 2]</span>"], correctIndex: 2, explanation: "Đáp án đúng là C<span class='citation'>[cite: 1]</span>." },
        { id: 6, text: "6. \\[H01.0001\\] Bào quan duy nhất không có cấu tạo màng sinh chất:<span class='citation'>[cite: 2]</span>", options: ["A. Ti thể<span class='citation'>[cite: 2]</span>", "B. Ribosom<span class='citation'>[cite: 2]</span>", "C. Tiêu thể<span class='citation'>[cite: 2]</span>", "D. Bộ Golgi<span class='citation'>[cite: 2]</span>"], correctIndex: 1, explanation: "Đáp án đúng là B<span class='citation'>[cite: 1]</span>." },
        { id: 7, text: "7. \\[H01.0073\\] Về mô hình Operon:<span class='citation'>[cite: 2]</span>", options: ["A. Gen cấu trúc tạo ra các ribosom tham gia vào quá trình tổng hợp protein<span class='citation'>[cite: 2]</span>", "B. Vị trí vận hành là nơi vận hành quá trình tổng hợp protein, nếu liên kết với các chất kìm hãm thì chỉ xảy ra được phiên mã nhưng không thể dịch mã được<span class='citation'>[cite: 2]</span>", "C. Vùng khởi đầu chứa vị trí vận hành và là nơi gắn vào của các ARN polymerase<span class='citation'>[cite: 2]</span>", "D. Gen điều chỉnh là nơi sản xuất ra các mARN rồi tổng hợp nên các enzym, khi vị trí vận hành bị kìm hãm thì không thể sinh mARN<span class='citation'>[cite: 2]</span>"], correctIndex: 2, explanation: "Đáp án đúng là C<span class='citation'>[cite: 1]</span>." },
        { id: 8, text: "8. \\[H01.0095\\] Không xảy ra trong giai đoạn kéo dài chuỗi polipeptid:<span class='citation'>[cite: 2]</span>", options: ["A. Vị trí A xuất hiện bộ ba UAA<span class='citation'>[cite: 2]</span>", "B. Các liên kết CO-NH được hình thành giữa các acid amin<span class='citation'>[cite: 2]</span>", "C. Gắn aminoacyl-tARN vào vị trí A trên ribosom<span class='citation'>[cite: 2]</span>", "D. Các yếu tố kéo dài gắn vào các aminoacyl-tARN<span class='citation'>[cite: 2]</span>"], correctIndex: 0, explanation: "Đáp án đúng là A<span class='citation'>[cite: 1]</span>." },
        { id: 9, text: "9. \\[H01.0048\\] Tạo lớp áo tế bào thông qua quá trình glycolsyl hóa là chức năng của:<span class='citation'>[cite: 2]</span>", options: ["A. Chresteron ở màng<span class='citation'>[cite: 2]</span>", "B. Photpholipid màng<span class='citation'>[cite: 2]</span>", "C. Protein màng<span class='citation'>[cite: 2]</span>", "D. Carbohydrat màng<span class='citation'>[cite: 2]</span>"], correctIndex: 3, explanation: "Đáp án đúng là D<span class='citation'>[cite: 1]</span>." },
        { id: 10, text: "10. \\[H01.0081\\] Đặc điểm chung của đột biến:<span class='citation'>[cite: 2]</span>", options: ["A. Do các tác nhân cả bên ngoài và bên trong cơ thể gây ra<span class='citation'>[cite: 2]</span>", "B. Không thể biểu hiện ngay ở kiểu hình mà phải chờ đến thế hệ sau<span class='citation'>[cite: 2]</span>", "C. Không thể di truyền<span class='citation'>[cite: 2]</span>", "D. Chỉ có thể xảy ra ở tế bào sinh dục<span class='citation'>[cite: 2]</span>"], correctIndex: 0, explanation: "Đáp án đúng là A<span class='citation'>[cite: 1]</span>." },
        { id: 11, text: "11. \\[H01.0066\\] Enzym không tham gia vào quá trình tái bản ADN:<span class='citation'>[cite: 2]</span>", options: ["A. Enzym topoisomerase<span class='citation'>[cite: 2]</span>", "B. Enzym ADN helicase<span class='citation'>[cite: 2]</span>", "C. Enzym ADN primase<span class='citation'>[cite: 2]</span>", "D. Enzym ADN polymerase phụ thuộc ARN<span class='citation'>[cite: 2]</span>"], correctIndex: 3, explanation: "Đáp án đúng là D<span class='citation'>[cite: 1]</span>." },
        { id: 12, text: "12. \\[H01.0065\\] Về chức năng của các ARN:<span class='citation'>[cite: 2]</span>", options: ["A. rARN có vai trò cấu trúc, là thành phần cấu tạo nên ribosom và tạo liên kết với các acid amin để đưa chúng đến đúng vị trí trên chuỗi polipeptid<span class='citation'>[cite: 2]</span>", "B. tARN mang thông tin di truyền từ ADN nhờ quá trình phiên mã để tổng hợp protein<span class='citation'>[cite: 2]</span>", "C. snARN đóng vai trò quan trọng trong quá trình hình thành ARN thuần thục<span class='citation'>[cite: 2]</span>", "D. mARN vận tải và liên kết với các acid amin, đưa chúng đến đúng vị trí trên chuỗi polipeptid<span class='citation'>[cite: 2]</span>"], correctIndex: 2, explanation: "Đáp án đúng là C<span class='citation'>[cite: 1]</span>." },
        { id: 13, text: "13. \\[H01.0109\\] Nhận định sai về quá trình tái bản ADN:<span class='citation'>[cite: 2]</span>", options: ["A. Cần có sự tham gia của các protein chuyên biệt để hoạt hóa các enzim<span class='citation'>[cite: 2]</span>", "B. Nguồn nucleotid lấy từ môi trường đến gắn vào hai sợi theo nguyên tắc bổ sung<span class='citation'>[cite: 2]</span>", "C. Sợi con chứa 1 sợi khuôn (sợi gốc) và 1 sợi được tổng hợp<span class='citation'>[cite: 2]</span>", "D. Xảy ra ở gian kỳ<span class='citation'>[cite: 2]</span>"], correctIndex: 0, explanation: "Đáp án đúng là A<span class='citation'>[cite: 1]</span>." },
        { id: 14, text: "14. \\[H01.0024\\] Về peroxysom:<span class='citation'>[cite: 2]</span>", options: ["A. Đóng vai trò điều chỉnh tổng hợp protein như một ribosom<span class='citation'>[cite: 2]</span>", "B. Hoạt động chủ yếu là phân giải H2O2 thành H2O nhờ enzim catalase<span class='citation'>[cite: 2]</span>", "C. Cả 3 ý trên<span class='citation'>[cite: 2]</span>", "D. Là bào quan tiêu hóa chính của tế bào<span class='citation'>[cite: 2]</span>"], correctIndex: 1, explanation: "Đáp án đúng là B<span class='citation'>[cite: 1]</span>." },
        { id: 15, text: "15. \\[H01.0091\\] Hiện tượng khảm:<span class='citation'>[cite: 2]</span>", options: ["A. Không được quan sát nhiều trong thực tiễn<span class='citation'>[cite: 2]</span>", "B. Thường xảy ra ở lần phân cắt đầu tiên của hợp tử<span class='citation'>[cite: 2]</span>", "C. Là dạng cơ thể với hai hay nhiều dòng tế bào cùng tồn tại<span class='citation'>[cite: 2]</span>", "D. Nếu xảy ra ở các lần phân cắt càng nhiều lần thì tính phức tạp càng giảm<span class='citation'>[cite: 2]</span>"], correctIndex: 2, explanation: "Đáp án đúng là C<span class='citation'>[cite: 1]</span>." },
        { id: 16, text: "16. \\[H01.0044\\] Chọn nhiều đáp án đúng: Điều kiện nào sau đây làm giảm sự khuếch tán qua màng:<span class='citation'>[cite: 2]</span>", options: ["A. Chất vận chuyển có kích thước và khối lượng nhỏ<span class='citation'>[cite: 2]</span>", "B. Khó tan trong lipid<span class='citation'>[cite: 2]</span>", "C. Nhu cầu hoạt động của tế bào<span class='citation'>[cite: 2]</span>", "D. Tác động tương hỗ giữa chất với nước tạo lớp hydrat bao ngoài<span class='citation'>[cite: 2]</span>"], correctIndex: [1, 3], explanation: "Đáp án đúng là B và D<span class='citation'>[cite: 1]</span>." },
        { id: 17, text: "17. \\[H01.0059\\] Trung thể mới xuất hiện cạnh trung thể cũ tại:<span class='citation'>[cite: 2]</span>", options: ["A. Kỳ cuối của phân bào<span class='citation'>[cite: 2]</span>", "B. Kỳ giữa của phân bào<span class='citation'>[cite: 2]</span>", "C. Kỳ đầu của phân bào<span class='citation'>[cite: 2]</span>", "D. Kỳ sau của phân bào<span class='citation'>[cite: 2]</span>"], correctIndex: 2, explanation: "Đáp án đúng là C<span class='citation'>[cite: 1]</span>." },
        { id: 18, text: "18. \\[H01.0060\\] Về histon H1:<span class='citation'>[cite: 2]</span>", options: ["A. Có tính acid khá lớn<span class='citation'>[cite: 2]</span>", "B. Có tính bảo thủ cao hơn các histon nucleosom<span class='citation'>[cite: 2]</span>", "C. Ảnh hưởng lớn tới việc kết đặc sợi chromatin<span class='citation'>[cite: 2]</span>", "D. Tham gia cấu tạo nên hạt nucleosom<span class='citation'>[cite: 2]</span>"], correctIndex: 2, explanation: "Đáp án đúng là C<span class='citation'>[cite: 1]</span>." },
        { id: 19, text: "19. \\[H01.0099\\] Nhận định sai về kết quả và mối liên quan giữa đảo đoạn và mất đoạn:<span class='citation'>[cite: 2]</span>", options: ["A. Nếu 2 chỗ đứt trên cùng 1 nhánh của 1 NST thì có thể gây ra đảo đoạn ngoài tâm hoặc mất đoạn giữa<span class='citation'>[cite: 2]</span>", "B. Nếu 2 chỗ đứt, mỗi chỗ trên 1 NST khác nhau thì có thể gây nên NST chuyển đoạn hoặc NST hai tâm<span class='citation'>[cite: 2]</span>", "C. Nếu 2 chỗ đứt trên 2 nhánh khác nhau của 1 NST thì có thể gây nên đảo đoạn quanh tâm hoặc NST hình vòng có tâm (mất đoạn cuối)<span class='citation'>[cite: 2]</span>", "D. Nếu 1 chỗ đứt trên 1 NST thì có thể gây nên đảo đoạn quanh tâm hoặc mất đoạn giữa<span class='citation'>[cite: 2]</span>"], correctIndex: 3, explanation: "Đáp án đúng là D<span class='citation'>[cite: 1]</span>." },
        { id: 20, text: "20. \\[H01.0106\\] Thuộc loại đột biến khung:<span class='citation'>[cite: 2]</span>", options: ["A. Thêm 1 bộ ba nucleotid<span class='citation'>[cite: 2]</span>", "B. Thay thế nucleotid<span class='citation'>[cite: 2]</span>", "C. Mất 1 nucleotid<span class='citation'>[cite: 2]</span>", "D. Đảo nucleotid<span class='citation'>[cite: 2]</span>"], correctIndex: 2, explanation: "Đáp án đúng là C<span class='citation'>[cite: 1]</span>." },
        { id: 21, text: "21. \\[H01.0046\\] Màng nhân ngoài không có đặc điểm sau:<span class='citation'>[cite: 2]</span>", options: ["A. Tỷ lệ choresteron là 25-30%<span class='citation'>[cite: 2]</span>", "B. Nối liền với màng lưới nội sinh chất<span class='citation'>[cite: 2]</span>", "C. Gửi các túi vận tải nội bào tới tiêu thể, tham gia hình thành một số màng nội bào<span class='citation'>[cite: 2]</span>", "D. Ngăn cách với màng nhân trong bởi khoảng quanh nhân<span class='citation'>[cite: 2]</span>"], correctIndex: 0, explanation: "Đáp án đúng là A<span class='citation'>[cite: 1]</span>." },
        { id: 22, text: "22. \\[H01.0041\\] Nhận định sai về sự chết tế bào có chương trình:<span class='citation'>[cite: 2]</span>", options: ["A. Góp phần cùng với sự phân bào duy trì số lượng tế bào của cơ thể<span class='citation'>[cite: 2]</span>", "B. Được coi như là một hoạt động sinh lý của tế bào<span class='citation'>[cite: 2]</span>", "C. Cơ chế là các enzim hoạt động bên trong tế bào kích thích và giết chết đồng thời các thành phần tế bào khi nhận được tín hiệu chết<span class='citation'>[cite: 2]</span>", "D. Nguyên nhân là do tế bào không được cấp máu đầy đủ khiến màng tế bào bị nứt<span class='citation'>[cite: 2]</span>"], correctIndex: 3, explanation: "Đáp án đúng là D<span class='citation'>[cite: 1]</span>." },
        { id: 23, text: "23. \\[H01.0104\\] Về rối loạn cấu trúc NST:<span class='citation'>[cite: 2]</span>", options: ["A. NST đều được sinh ra do sự phân tách dọc theo chiều của chromatid. Các NST này không thể tham gia vào quá trình phân bào tiếp theo<span class='citation'>[cite: 2]</span>", "B. Nếu 2 chỗ đứt xảy ra trên cùng 1 nhánh của 1 NST thì các NST bị rối loạn đều có khả năng tham gia vào các lần phân bào tiếp theo<span class='citation'>[cite: 2]</span>", "C. Nhân đoạn nguyên phát xảy ra do sự bắt chéo và ghép đôi giữa 1 NST đảo đoạn và NST tương đồng...<span class='citation'>[cite: 2]</span>", "D. Nếu 2 chỗ đứt xảy ra trên 2 nhánh khác nhau của cùng 1 NST thì các NST bị rối loạn đều có khả năng tham gia vào các lần phân bào tiếp theo<span class='citation'>[cite: 2]</span>"], correctIndex: 1, explanation: "Đáp án đúng là B<span class='citation'>[cite: 1]</span>." },
        { id: 24, text: "24. \\[H01.0082\\] Không phải đặc điểm của ADN:<span class='citation'>[cite: 2]</span>", options: ["A. Có thể bị đột biến, song vẫn có thể không ảnh hưởng tới sản phẩm protein sau này<span class='citation'>[cite: 2]</span>", "B. Kích thước ADN liên quan chặt chẽ đến sự tiến hóa sinh vật và được coi là thước đo mức độ tiến hóa cấp độ tế bào<span class='citation'>[cite: 2]</span>", "C. Mang thông tin di truyền, tạo nên genome<span class='citation'>[cite: 2]</span>", "D. Có thể tái bản (bán bảo tồn) và phiên mã tạo ARN và ngược lại, các ARN có thể phiên mã ngược nhờ enzym để hình thành nên ADN<span class='citation'>[cite: 2]</span>"], correctIndex: 1, explanation: "Đáp án đúng là B<span class='citation'>[cite: 1]</span>." },
        { id: 25, text: "25. \\[H01.0022\\] Về màng của tiêu thể:<span class='citation'>[cite: 2]</span>", options: ["A. Dễ dàng bị thủy phân do hệ thống enzim tiêu hóa bên trong, do đó, tiêu thể không được màng sinh chất bao bọc<span class='citation'>[cite: 2]</span>", "B. Tỷ lệ P/L xấp xỉ bằng 2<span class='citation'>[cite: 2]</span>", "C. Thành phần chresteron xấp xỉ 10%<span class='citation'>[cite: 2]</span>", "D. Có protein màng chuyên bơm H+ duy trì độ pH<span class='citation'>[cite: 2]</span>"], correctIndex: 3, explanation: "Đáp án đúng là D<span class='citation'>[cite: 1]</span>." },
        { id: 26, text: "26. \\[H01.0070\\] Giai đoạn kéo dài mạch trong tái bản ADN:<span class='citation'>[cite: 2]</span>", options: ["A. Enzym ADN primase trực tiếp tham gia tổng hợp trên cả sợi nhanh và sợi chậm<span class='citation'>[cite: 2]</span>", "B. Các đoạn ARN mồi được loại bỏ hình thành những đoạn trống.<span class='citation'>[cite: 2]</span>", "C. Chiều của mạch được tổng hợp theo chiều 3’ - 5’ Sợi nhanh được tổng hợp liên tục, sợi chậm tổng hợp gián đoạn thông qua các ARN mồi<span class='citation'>[cite: 2]</span>", "D. Các đoạn trống được nối bằng enzym nối ligase<span class='citation'>[cite: 2]</span>"], correctIndex: 1, explanation: "Đáp án đúng là B<span class='citation'>[cite: 1]</span>." },
        { id: 27, text: "27. \\[H01.0100\\] Để có thể kết thúc được quá trình phiên mã:<span class='citation'>[cite: 2]</span>", options: ["A. Chỉ nhận tín hiệu kết thúc từ yếu tố Rho<span class='citation'>[cite: 2]</span>", "B. Do enzym có khả năng tự nhận biết để tự kết thúc<span class='citation'>[cite: 2]</span>", "C. Nhận tín hiệu kết thúc từ yếu tố Rho hoặc ADN<span class='citation'>[cite: 2]</span>", "D. Chỉ nhận tín hiệu kết thúc từ chính ADN<span class='citation'>[cite: 2]</span>"], correctIndex: 2, explanation: "Đáp án đúng là C<span class='citation'>[cite: 1]</span>." },
        { id: 28, text: "28. \\[H01.0015\\] Về sự sai khác thành phần hóa học trong sự phân cực của dictiosom:<span class='citation'>[cite: 2]</span>", options: ["A. Tỷ lệ P/L giảm dần<span class='citation'>[cite: 2]</span>", "B. Tỷ lệ choresteron hầu như không thay đổi<span class='citation'>[cite: 2]</span>", "C. Tỷ lệ P/L có thể tăng hoặc giảm<span class='citation'>[cite: 2]</span>", "D. Tỷ lệ choresteron tăng dần<span class='citation'>[cite: 2]</span>"], correctIndex: 0, explanation: "Đáp án đúng là A<span class='citation'>[cite: 1]</span>." },
        { id: 29, text: "29. \\[H01.0039\\] Bơm Ca2+ trong màng lưới nội sinh chất nhẵn để tạo sự co duỗi cơ:<span class='citation'>[cite: 2]</span>", options: ["A. Không cần tiêu hao năng lượng, song vẫn có trường hợp phải tiêu dùng năng lượng<span class='citation'>[cite: 2]</span>", "B. Không cần vận tải viên<span class='citation'>[cite: 2]</span>", "C. Là loại vận chuyển trung gian, cần protein vận tải<span class='citation'>[cite: 2]</span>", "D. Là một loại protein màng<span class='citation'>[cite: 2]</span>"], correctIndex: 3, explanation: "Đáp án đúng là D<span class='citation'>[cite: 1]</span>." },
        { id: 30, text: "30. \\[H01.0010\\] Nhận định sai về photpholipid:<span class='citation'>[cite: 2]</span>", options: ["A. Liên kết với carbohydrat trên bề mặt màng tạo tính đặc hiệu<span class='citation'>[cite: 2]</span>", "B. Phụ trách vận chuyển chủ động qua màng<span class='citation'>[cite: 2]</span>", "C. Tạo tính lỏng linh động cho màng tế bào do sự đổi chỗ của các phân tử<span class='citation'>[cite: 2]</span>", "D. Là thành phần chính tạo nên lớp kép lipid<span class='citation'>[cite: 2]</span>"], correctIndex: 1, explanation: "Đáp án đúng là B<span class='citation'>[cite: 1]</span>." },
        { id: 31, text: "31. \\[H01.0004\\] Về choresteron trong màng tế bào:<span class='citation'>[cite: 2]</span>", options: ["A. Là thành phần chủ yếu của lipid màng<span class='citation'>[cite: 2]</span>", "B. Làm tăng tính linh động của tế bào<span class='citation'>[cite: 2]</span>", "C. Chiếm tỷ lệ khoảng 55%<span class='citation'>[cite: 2]</span>", "D. Nằm xen kẽ giữa các photpholipid và ở cả 2 lớp lipid màng<span class='citation'>[cite: 2]</span>"], correctIndex: 3, explanation: "Đáp án đúng là D<span class='citation'>[cite: 1]</span>." },
        { id: 32, text: "32. \\[H01.0076\\] Thí nghiệm sự sinh sản của virus phagio chứng tỏ:<span class='citation'>[cite: 2]</span>", options: ["A. Vỏ protein vào được bên trong vi khuẩn và cùng với ADN sinh sản nhiều phagio<span class='citation'>[cite: 2]</span>", "B. Vỏ protein vào được bên trong vi khuẩn và cùng với ARN sinh sản nhiều phagio<span class='citation'>[cite: 2]</span>", "C. Vỏ protein không tham gia vào vật chất di truyền<span class='citation'>[cite: 2]</span>", "D. ARN là vật chất di truyền của phagio<span class='citation'>[cite: 2]</span>"], correctIndex: 2, explanation: "Đáp án đúng là C<span class='citation'>[cite: 1]</span>." },
        { id: 33, text: "33. \\[H01.0110\\] Vai trò của protein SSB trong quá trình tái bản:<span class='citation'>[cite: 2]</span>", options: ["A. Giúp định vị vị trí khởi đầu và ngăn cản sự kết hợp của hai sợi đơn<span class='citation'>[cite: 2]</span>", "B. Giúp hoàn thiện các khoảng trống sau khi ARN mồi bị loại bỏ<span class='citation'>[cite: 2]</span>", "C. Giúp ADN nhanh chóng tháo xoắn<span class='citation'>[cite: 2]</span>", "D. Giúp tổng hợp những đoạn ARN mồi và sau đó loại bỏ chúng<span class='citation'>[cite: 2]</span>"], correctIndex: 0, explanation: "Đáp án đúng là A<span class='citation'>[cite: 1]</span>." },
        { id: 34, text: "34. \\[H01.0063\\] ADN:<span class='citation'>[cite: 2]</span>", options: ["A. Luôn tồn tại ở dạng sợi đơn<span class='citation'>[cite: 2]</span>", "B. Mang thông tin di truyền ở tất cả các loài sinh vật trên trái đất<span class='citation'>[cite: 2]</span>", "C. Hướng quy ước là chiều 5' -&gt; 3'<span class='citation'>[cite: 2]</span>", "D. Cấu tạo từ các đơn phân là các peptid<span class='citation'>[cite: 2]</span>"], correctIndex: 2, explanation: "Đáp án đúng là C<span class='citation'>[cite: 1]</span>." },
        { id: 35, text: "35. \\[H01.0087\\] Về giai đoạn khởi đầu tái bản:<span class='citation'>[cite: 2]</span>", options: ["A. Các enzym ADN polymerase III tổng hợp liên tục trên sợi nhanh<span class='citation'>[cite: 2]</span>", "B. Các ARN mồi được loại bỏ nhờ các enzym helicase<span class='citation'>[cite: 2]</span>", "C. Enzym ligase mang vai trò quyết định<span class='citation'>[cite: 2]</span>", "D. Các ARN mồi được hình thành nhờ thể khởi đầu (primosome)<span class='citation'>[cite: 2]</span>"], correctIndex: 3, explanation: "Đáp án đúng là D<span class='citation'>[cite: 1]</span>." },
        { id: 36, text: "36. \\[H01.0029\\] Cho các diễn biến sau:<br>1. Hình thành thể đậm<br>2. Túi trao enzim cho thể nội bào muộn, hình thành tiêu thể<br>3. Enzim tiêu hóa được tổng hợp và mang tới lưới nội sinh chất có hạt<br>4. Enzym được photphoryl hóa để làm tín hiệu cho ổ tiếp nhận ở bề mặt túi dẹt thắt lại thành túi cầu Golgi<br>5. Quá trình glycosyl hóa tạo tín hiệu dẫn đường cho enzim tới bộ máy Golgi<br>Thứ tự đúng cho quá trình hình thành tiêu thể là:<span class='citation'>[cite: 2]</span>", options: ["A. 1, 5, 3, 4, 2<span class='citation'>[cite: 2]</span>", "B. 3, 1, 5, 4, 2<span class='citation'>[cite: 2]</span>", "C. 1, 3, 5, 4, 2<span class='citation'>[cite: 2]</span>", "D. 3, 5, 1, 4, 2<span class='citation'>[cite: 2]</span>"], correctIndex: 3, explanation: "Đáp án đúng là D<span class='citation'>[cite: 1]</span>." },
        { id: 37, text: "37. \\[H01.0072\\] Giai đoạn mở đầu chuỗi trong sinh tổng hợp protein của Prokaryota:<span class='citation'>[cite: 2]</span>", options: ["A. Khác với ở Eukaryota là không hề có sự hiện diện của các yếu tố mở đầu<span class='citation'>[cite: 2]</span>", "B. Có sự tham gia của các yếu tố mở đầu có bản chất là các protein đặc hiệu để gắn vào ribosom hay mARN để nhận diện mã mở đầu và gắn acid amin mở đầu<span class='citation'>[cite: 2]</span>", "C. Mở đầu bằng acid amin methionin được vận chuyển bởi tARN, ký hiệu là met-tARN<span class='citation'>[cite: 2]</span>", "D. Phức hợp giữa acidamin đầu tiên và tARN được gắn vào vị trí A trên phân đơn vị lớn của ribosom<span class='citation'>[cite: 2]</span>"], correctIndex: 1, explanation: "Đáp án đúng là B<span class='citation'>[cite: 1]</span>." },
        { id: 38, text: "38. \\[H01.0006\\] Protein ngoại vi ở mặt ngoài màng tế bào là:<span class='citation'>[cite: 2]</span>", options: ["A. Ankyrin<span class='citation'>[cite: 2]</span>", "B. Spectin<span class='citation'>[cite: 2]</span>", "C. Fibronectin<span class='citation'>[cite: 2]</span>", "D. Actin<span class='citation'>[cite: 2]</span>"], correctIndex: 2, explanation: "Đáp án đúng là C<span class='citation'>[cite: 1]</span>." },
        { id: 39, text: "39. \\[H01.0030\\] Lamina:<span class='citation'>[cite: 2]</span>", options: ["A. Lót ở mặt ngoài của màng nhân trong<span class='citation'>[cite: 2]</span>", "B. Được tạo thành từ các sợi vi thể<span class='citation'>[cite: 2]</span>", "C. Có bản chất là hệ thống lipid<span class='citation'>[cite: 2]</span>", "D. Là nơi neo của các sợi chromatin ở vùng ngoại vi của nhân<span class='citation'>[cite: 2]</span>"], correctIndex: 3, explanation: "Đáp án đúng là D<span class='citation'>[cite: 1]</span>." },
        { id: 40, text: "40. \\[H01.0071\\] Không phải đặc điểm của mã di truyền:<span class='citation'>[cite: 2]</span>", options: ["A. Có tính vạn năng và thoái biến<span class='citation'>[cite: 2]</span>", "B. Là mã bộ ba<span class='citation'>[cite: 2]</span>", "C. Nucleotid thứ ba dễ bị thay đổi nhưng không làm thay đổi tính chất mã<span class='citation'>[cite: 2]</span>", "D. Mang mã kết thúc là AUG, UGG, UGA<span class='citation'>[cite: 2]</span>"], correctIndex: 3, explanation: "Đáp án đúng là D<span class='citation'>[cite: 1]</span>." },
        { id: 41, text: "41. \\[H01.0075\\] Hợp tử tam bội là đột biến:<span class='citation'>[cite: 2]</span>", options: ["A. Đảo đoạn liên quan đến cấu trúc NST<span class='citation'>[cite: 2]</span>", "B. Đa bội liên quan đến cấu trúc NST<span class='citation'>[cite: 2]</span>", "C. Đa bội liên quan đến số lượng NST<span class='citation'>[cite: 2]</span>", "D. Lệch bội liên quan đến số lượng NST<span class='citation'>[cite: 2]</span>"], correctIndex: 2, explanation: "Đáp án đúng là C<span class='citation'>[cite: 1]</span>." },
        { id: 42, text: "42. \\[H01.0002\\] Về màng của tiêu thể:<span class='citation'>[cite: 2]</span>", options: ["A. Không có cấu tạo màng sinh chất<span class='citation'>[cite: 2]</span>", "B. Có thành phần P/L khác với màng tế bào<span class='citation'>[cite: 2]</span>", "C. Có tỷ lệ choresteron là khoảng 6%<span class='citation'>[cite: 2]</span>", "D. Có protein màng chuyên bơm H+ để ổn định pH<span class='citation'>[cite: 2]</span>"], correctIndex: 3, explanation: "Đáp án đúng là D<span class='citation'>[cite: 1]</span>." },
        { id: 43, text: "43. \\[H01.0050\\] Vận chuyển anion qua màng (Cl- hay HCO3-) là hình thức vận chuyển:<span class='citation'>[cite: 2]</span>", options: ["A. Trung gian<span class='citation'>[cite: 2]</span>", "B. Ẩm bào<span class='citation'>[cite: 2]</span>", "C. Nội thực bào<span class='citation'>[cite: 2]</span>", "D. Chủ động<span class='citation'>[cite: 2]</span>"], correctIndex: 0, explanation: "Đáp án đúng là A<span class='citation'>[cite: 1]</span>." },
        { id: 44, text: "44. \\[H01.0062\\] Thí nghiệm của Avery, Macleod và Carty nếu cho vào môi trường nuôi cấy vi khuẩn chủng R, ADN tinh khiết chủng S và enzim deoxyribonuclease thì:<span class='citation'>[cite: 2]</span>", options: ["A. Có hiện tượng chuyển thể<span class='citation'>[cite: 2]</span>", "B. Xuất hiện những tế bào chủng R nhưng với số lượng ít<span class='citation'>[cite: 2]</span>", "C. Không có hiện tượng chuyển thể<span class='citation'>[cite: 2]</span>", "D. Xuất hiện những tế bào chủng S nhưng với số lượng ít<span class='citation'>[cite: 2]</span>"], correctIndex: 2, explanation: "Đáp án đúng là C<span class='citation'>[cite: 1]</span>." },
        { id: 45, text: "45. \\[H01.0037\\] Lỗ màng nhân:<span class='citation'>[cite: 2]</span>", options: ["A. Có thể có lớp lamina lát kín hết các lỗ màng nhân<span class='citation'>[cite: 2]</span>", "B. Là nơi qua lại của protein được tổng hợp từ tế bào chất, của mARN, tARN theo hướng ngược lại và SnARN theo cả hai chiều<span class='citation'>[cite: 2]</span>", "C. Tạo phức hợp lỗ màng nhân gồm 2 vòng hạt protein 8 cạnh có hình chiếu trùng nhau<span class='citation'>[cite: 2]</span>", "D. Chỉ có ở màng nhân tế bào Prokaryota<span class='citation'>[cite: 2]</span>"], correctIndex: 1, explanation: "Đáp án đúng là B<span class='citation'>[cite: 1]</span>." },
        { id: 46, text: "46. \\[H01.0019\\] Nhận định sai về chức năng của lưới nội sinh chất có hạt:<span class='citation'>[cite: 2]</span>", options: ["A. Tiếp nhận, chế biến , bao gói và gửi đi các protein đến đúng địa chỉ giao nhận nhờ tín hiệu dẫn đường<span class='citation'>[cite: 2]</span>", "B. Có khả năng tổng hợp lipid ngay trong màng lưới để thay thế các phần già cũ và làm nguyên liệu cho bào quan khác<span class='citation'>[cite: 2]</span>", "C. Quá trình photphoryl hóa và glycosyl hóa trong lòng lưới tạo các tín hiệu dẫn đường để sản phẩm đến đúng nơi giao nhận<span class='citation'>[cite: 2]</span>", "D. Là nơi bám của các Ribosom, chúng bám trên màng lưới có thể tạo ra các protein tiết<span class='citation'>[cite: 2]</span>"], correctIndex: 2, explanation: "Đáp án đúng là C<span class='citation'>[cite: 1]</span>." },
        { id: 47, text: "47. \\[H01.0057\\] Người ta có thể xác định ADN để xác định cá thể trong những cái chết tập thể dựa vào:<span class='citation'>[cite: 2]</span>", options: ["A. ADN trong ty thể có số lượng tồn tại lớn<span class='citation'>[cite: 2]</span>", "B. Dựa vào khung xương tế bào<span class='citation'>[cite: 2]</span>", "C. ADN trong nhân<span class='citation'>[cite: 2]</span>", "D. Cấu trúc màng tế bào, màng nhân<span class='citation'>[cite: 2]</span>"], correctIndex: 0, explanation: "Đáp án đúng là A<span class='citation'>[cite: 1]</span>." },
        { id: 48, text: "48. \\[H01.0085\\] Thí nghiệm không chứng minh ADN (hoặc ARN) mang thông tin di truyền:<span class='citation'>[cite: 2]</span>", options: ["A. Thí nghiệm virus phagio<span class='citation'>[cite: 2]</span>", "B. Thí nghiệm virus khảm thuốc lá<span class='citation'>[cite: 2]</span>", "C. Thí nghiệm chuột chuyển gen<span class='citation'>[cite: 2]</span>", "D. Thí nghiệm Griffith<span class='citation'>[cite: 2]</span>"], correctIndex: 3, explanation: "Đáp án đúng là D<span class='citation'>[cite: 1]</span>." },
        { id: 49, text: "49. \\[H01.0074\\] Về mô hình cấu trúc gen của Eukaryota:<span class='citation'>[cite: 2]</span>", options: ["A. Vùng khởi đầu nằm ở vùng kiểm soát hoạt động của gen do chúng xác định vị trí khởi đầu quá trình sinh tổng hợp protein, là nơi mà ARN polymerase II gắn vào<span class='citation'>[cite: 2]</span>", "B. Gen cấu trúc chỉ chứa những đoạn exon chứa những đoạn ADN có khả năng phiên mã để hình thành mARN, từ đó sinh tổng hợp protein<span class='citation'>[cite: 2]</span>", "C. Gen cấu trúc không mang tính đặc hiệu do chúng có thể sản xuất ra những protein mang đặc tính khác nhau<span class='citation'>[cite: 2]</span>", "D. Vùng kiểm soát biểu hiện gen chứa những vị trí gắn những yếu tố quản lý, các yếu tố kích thích, điều hòa mọi hoạt động của gen<span class='citation'>[cite: 2]</span>"], correctIndex: 3, explanation: "Đáp án đúng là D<span class='citation'>[cite: 1]</span>." },
        { id: 50, text: "50. \\[H01.0107\\] Đặc điểm sai khác trong phiên mã của Eukaryota và Prokaryota :<span class='citation'>[cite: 2]</span>", options: ["A. Về các protein làm nhiệm vụ như yếu tố phiên mã, bao gồm cả vùng khởi đầu và hoạt hóa hệ thống enzym<span class='citation'>[cite: 2]</span>", "B. Về hệ thống enzym<span class='citation'>[cite: 2]</span>", "C. Cả 3 ý trên<span class='citation'>[cite: 2]</span>", "D. Về tính phức tạp thêm của quá trình thuần thục hóa mARN trong Eukaryota<span class='citation'>[cite: 2]</span>"], correctIndex: 2, explanation: "Đáp án đúng là C<span class='citation'>[cite: 1]</span>." },
        { id: 51, text: "51. \\[H01.0103\\] Quá trình tạo mARN thuần thục:<span class='citation'>[cite: 2]</span>", options: ["A. Có sự tham gia của các snARN tạo thể nối<span class='citation'>[cite: 2]</span>", "B. Thực chất là quá trình loại bỏ các exon và nối các intron lại với nhau<span class='citation'>[cite: 2]</span>", "C. Xảy ra chỉ với tế bào Prokaryota<span class='citation'>[cite: 2]</span>", "D. Xảy ra sau khi quá trình dịch mã kết thúc<span class='citation'>[cite: 2]</span>"], correctIndex: 0, explanation: "Đáp án đúng là A<span class='citation'>[cite: 1]</span>." },
        { id: 52, text: "52. \\[H01.0069\\] Về sự biến tính của ADN:<span class='citation'>[cite: 2]</span>", options: ["A. Được sử dụng trong phương pháp lai phân tử<span class='citation'>[cite: 2]</span>", "B. Xảy ra do sự hợp lại các liên kết hidro giữa các base theo nguyên tắc bổ sung<span class='citation'>[cite: 2]</span>", "C. Là hiện tượng các sợi đơn kết hợp với nhau<span class='citation'>[cite: 2]</span>", "D. Diễn ra đồng thời với quá trình hồi tính<span class='citation'>[cite: 2]</span>"], correctIndex: 0, explanation: "Đáp án đúng là A<span class='citation'>[cite: 1]</span>." },
        { id: 53, text: "53. \\[H01.0013\\] Về lưới nội sinh chất có hạt:<span class='citation'>[cite: 2]</span>", options: ["A. Màng linh động hơn màng tế bào<span class='citation'>[cite: 2]</span>", "B. Trên bề mặt ngoài màng có những ribosom gắn vào<span class='citation'>[cite: 2]</span>", "C. Là hệ thống các túi dẹt và ống nhỏ thông với khoảng quanh nhân và tế bào chất<span class='citation'>[cite: 2]</span>", "D. Màng lưới nội sinh chất có tỷ lệ P/L giống màng tế bào<span class='citation'>[cite: 2]</span>"], correctIndex: 0, explanation: "Đáp án đúng là A<span class='citation'>[cite: 1]</span>." },
        { id: 54, text: "54. \\[H01.0020\\] Lưới nội sinh chất nhẵn:<span class='citation'>[cite: 2]</span>", options: ["A. Có ở chủ yếu tại tế bào cơ<span class='citation'>[cite: 2]</span>", "B. Là hệ thống các túi chồng dẹt xếp chồng lên nhau thành một túi kín<span class='citation'>[cite: 2]</span>", "C. Có màng lưới với thành phần choresteron là 6%<span class='citation'>[cite: 2]</span>", "D. Không thông với hệ thống lưới nội sinh chất có hạt<span class='citation'>[cite: 2]</span>"], correctIndex: 0, explanation: "Đáp án đúng là A<span class='citation'>[cite: 1]</span>." },
        { id: 55, text: "55. \\[H01.0026\\] Trung thể và trung tử:<span class='citation'>[cite: 2]</span>", options: ["A. Thực vật bậc cao vẫn có trung tử nhưng không có trung thể<span class='citation'>[cite: 2]</span>", "B. Ba trung tử xếp đôi một vuông góc hình thành nên trung thể<span class='citation'>[cite: 2]</span>", "C. Thành ống gồm 6 tấm protein, mỗi ống gồm 4 ống vi thể xếp liền nhau<span class='citation'>[cite: 2]</span>", "D. Có vai trò quan trọng trong việc hình thành thoi vô sắc lúc phân bào<span class='citation'>[cite: 2]</span>"], correctIndex: 3, explanation: "Đáp án đúng là D<span class='citation'>[cite: 1]</span>." },
        { id: 56, text: "56. \\[H01.0053\\] Đặc điểm sai khác cơ bản của nội thực bào và ẩm bào:<span class='citation'>[cite: 2]</span>", options: ["A. Chiều hướng vận chuyển<span class='citation'>[cite: 2]</span>", "B. Tính chất đặc hiệu của mồi<span class='citation'>[cite: 2]</span>", "C. Bào quan hay cơ quan đích<span class='citation'>[cite: 2]</span>", "D. Hình thức vận chuyển túi<span class='citation'>[cite: 2]</span>"], correctIndex: 1, explanation: "Đáp án đúng là B<span class='citation'>[cite: 1]</span>." },
        { id: 57, text: "57. \\[H01.0032\\] Đặc điểm không phải của vận chuyển thụ động:<span class='citation'>[cite: 2]</span>", options: ["A. Không cần dùng năng lượng<span class='citation'>[cite: 2]</span>", "B. Là một loại vận chuyển thấm<span class='citation'>[cite: 2]</span>", "C. Không có bất kỳ sự liên kết nào giữa chất vận chuyển và chất khác<span class='citation'>[cite: 2]</span>", "D. Chỉ vận chuyển được theo một chiểu nhất định<span class='citation'>[cite: 2]</span>"], correctIndex: 3, explanation: "Đáp án đúng là D<span class='citation'>[cite: 1]</span>." },
        { id: 58, text: "58. \\[H01.0008\\] Về mạng lưới protein lót ở mặt trong màng tế bào:<span class='citation'>[cite: 2]</span>", options: ["A. Cả 3 ý trên đều đúng<span class='citation'>[cite: 2]</span>", "B. Đỉnh là các fibronectin và actin<span class='citation'>[cite: 2]</span>", "C. Níu vào màng bằng các liên kết với photpholipid<span class='citation'>[cite: 2]</span>", "D. Mỗi mắt lưới là lục giác cạnh là spectin<span class='citation'>[cite: 2]</span>"], correctIndex: 3, explanation: "Đáp án đúng là D<span class='citation'>[cite: 1]</span>." },
        { id: 59, text: "59. \\[H01.0101\\] Về chuyển đoạn tương hỗ:<span class='citation'>[cite: 2]</span>", options: ["A. Số lượng NST bị giảm đi<span class='citation'>[cite: 2]</span>", "B. Có thể được hình thành do nguyên nhân đứt 2 vị trí trên 1 NST<span class='citation'>[cite: 2]</span>", "C. Không mang tính di truyền<span class='citation'>[cite: 2]</span>", "D. Hình thành chữ thập chuyển đoạn trong giai đoạn tiếp hợp<span class='citation'>[cite: 2]</span>"], correctIndex: 3, explanation: "Đáp án đúng là D<span class='citation'>[cite: 1]</span>." },
        { id: 60, text: "60. \\[H01.0047\\] Quá trình nội thực bào:<span class='citation'>[cite: 2]</span>", options: ["A. Quá trình photphoryl hóa các protein góp phần nhận biết các chất đặc hiệu trên ổ tiếp nhận<span class='citation'>[cite: 2]</span>", "B. Có ổ tiếp nhận trên màng và có thể bị hao hụt mối khi hình thành túi<span class='citation'>[cite: 2]</span>", "C. Hình thành nên các thể thực bào muộn ngay khi hình thành túi<span class='citation'>[cite: 2]</span>", "D. Vận chuyển nhờ sự khuếch tán giống như với các loại vận chuyển thấm<span class='citation'>[cite: 2]</span>"], correctIndex: 1, explanation: "Đáp án đúng là B<span class='citation'>[cite: 1]</span>." },
        { id: 61, text: "61. \\[H01.0018\\] Nhận định sai về ribosom:<span class='citation'>[cite: 2]</span>", options: ["A. Ribosom tự do là nơi sản xuất protein thuộc bộ xương của tế bào<span class='citation'>[cite: 2]</span>", "B. Các bào quan riêng ko có ribosom riêng cho nó, chỉ có thể dùng sphẩm từ ribosom của TB<span class='citation'>[cite: 2]</span>", "C. Ribosom có thể được gắn vào màng nhân hoặc màng lưới nội sinh chất nhờ 1 receptor trên màng<span class='citation'>[cite: 2]</span>", "D. Polysom là hình ảnh nhiều ribosom làm việc đồng thời trên một sợi mARN và do đó, các chuỗi peptid tổng hợp được đều giống nhau<span class='citation'>[cite: 2]</span>"], correctIndex: 1, explanation: "Đáp án đúng là B<span class='citation'>[cite: 1]</span>." },
        { id: 62, text: "62. \\[H01.0096\\] Về điều chỉnh sinh tổng hợp protein ở Eukaryota:<span class='citation'>[cite: 2]</span>", options: ["A. Dựa trên sự lưu thông dịch, các phân tử protein di chuyển khắp cơ thể và gây tương tác với các ADN hay các enzym để gây ức chế hay hoạt hóa theo đúng nhu cầu tế bào<span class='citation'>[cite: 2]</span>", "B. Thực chất là điều chỉnh biểu hiện của gen do tính đặc hiệu của protein ở những cơ quan khác nhau<span class='citation'>[cite: 2]</span>", "C. Tất cả đều đúng<span class='citation'>[cite: 2]</span>", "D. Qua nhiều bước từ ADN cho tới mARN tiền thân, mARN và cuối cùng là protein<span class='citation'>[cite: 2]</span>"], correctIndex: 2, explanation: "Đáp án đúng là C<span class='citation'>[cite: 1]</span>." },
        { id: 63, text: "63. \\[H01.0038\\] Đặc điểm cơ bản của giữa vận chuyển trung gian khác hoàn toàn vận chuyển thụ động:<span class='citation'>[cite: 2]</span>", options: ["A. Sự vận chuyển theo 2 chiều<span class='citation'>[cite: 2]</span>", "B. Tuân theo gradient nồng độ<span class='citation'>[cite: 2]</span>", "C. Có vận tải viên mang bản chất protein<span class='citation'>[cite: 2]</span>", "D. Không cần năng lượng<span class='citation'>[cite: 2]</span>"], correctIndex: 2, explanation: "Đáp án đúng là C<span class='citation'>[cite: 1]</span>." },
        { id: 64, text: "64. \\[H01.0016\\] Không phải nguồn cung cấp để hình thành các túi dẹt trong bộ Golgi là:<span class='citation'>[cite: 2]</span>", options: ["A. Sự nhân đôi của chính túi dẹt Golgi<span class='citation'>[cite: 2]</span>", "B. Các túi thải cặn bã từ tiêu thể<span class='citation'>[cite: 2]</span>", "C. Thể đậm<span class='citation'>[cite: 2]</span>", "D. Túi cầu từ màng nhân<span class='citation'>[cite: 2]</span>"], correctIndex: 1, explanation: "Đáp án đúng là B<span class='citation'>[cite: 1]</span>." },
        { id: 65, text: "65. \\[H01.0003\\] Điều đúng về lớp kép lipid:<span class='citation'>[cite: 2]</span>", options: ["A. Đầu kị nước quay ra ngoài tế bào, đầu ưa nước quay vào trong tế bào<span class='citation'>[cite: 2]</span>", "B. Đầu kị nước tiếp xúc với môi trường nội bào<span class='citation'>[cite: 2]</span>", "C. Đầu ưa nước có thể tiếp xúc với cả môi trường ngoài tế bào và tế bào chất<span class='citation'>[cite: 2]</span>", "D. Đầu ưa nước được giấu vào bên trong lớp tiếp xúc của 2 lớp lipid<span class='citation'>[cite: 2]</span>"], correctIndex: 2, explanation: "Đáp án đúng là C<span class='citation'>[cite: 1]</span>." },
        { id: 66, text: "66. \\[H01.0033\\] Gian kỳ:<span class='citation'>[cite: 2]</span>", options: ["A. Là kỳ xen giữa 2 lần phân bào, chuẩn bị cơ sở vật chất trước khi phân bào<span class='citation'>[cite: 2]</span>", "B. Tồn tại trong thời gian ngắn hơn thời gian phân bào<span class='citation'>[cite: 2]</span>", "C. ADN được nhân đôi ở pha G2<span class='citation'>[cite: 2]</span>", "D. Có 2 giai đoạn là G1 và G2<span class='citation'>[cite: 2]</span>"], correctIndex: 0, explanation: "Đáp án đúng là A<span class='citation'>[cite: 1]</span>." },
        { id: 67, text: "67. \\[H01.0067\\] Về enzym ARN polymerase trong phiên mã của tế bào Prokaryota:<span class='citation'>[cite: 2]</span>", options: ["A. Là enzym duy nhất xúc tác tổng hợp các loại ARN<span class='citation'>[cite: 2]</span>", "B. Cấu tạo gồm 4 chuỗi polipeptid<span class='citation'>[cite: 2]</span>", "C. Cùng với các enzym khác như ADN polimerase tham gia vào tổng hợp ARN<span class='citation'>[cite: 2]</span>", "D. Chuỗi alpha chỉ gắn tạm thời vào lõi enzym để enzym gắn được vào vị trí thích hợp trên hai sợi khuôn của ADN<span class='citation'>[cite: 2]</span>"], correctIndex: 0, explanation: "Đáp án đúng là A<span class='citation'>[cite: 1]</span>." },
        { id: 68, text: "68. \\[H01.0040\\] Sự phát sinh trứng không có đặc điểm nào sau đây:<span class='citation'>[cite: 2]</span>", options: ["A. Nếu không có tinh trùng đến thụ tinh thì noãn bào II giảm nhiễm 2 cuối cùng để hình thành nên noãn cầu và cực cầu II, cực cầu I giảm nhiễm 2 cho 2 cực cầu II<span class='citation'>[cite: 2]</span>", "B. Noãn bào I đã được hình thành từ rất sớm, nhưng quá trình phân bào bị dừng lại tại giai đoạn thể kép kỳ đầu I<span class='citation'>[cite: 2]</span>", "C. Noãn bào I giảm nhiêm 1 cho noãn bào II và cực cầu I, là lúc trứng rụng để đón tinh trùng<span class='citation'>[cite: 2]</span>", "D. Xảy ra một cách không liên tục<span class='citation'>[cite: 2]</span>"], correctIndex: 0, explanation: "Đáp án đúng là A<span class='citation'>[cite: 1]</span>." },
        { id: 69, text: "69. \\[H01.0084\\] Về chức năng của các enzym trong tái bản ADN:<span class='citation'>[cite: 2]</span>", options: ["A. ADN primase có vai trò tổng hợp nên các ARN mồi<span class='citation'>[cite: 2]</span>", "B. ADN polymerase I giúp ADN tháo xoắn và ngăn cản sự hợp lại của các sợi đơn trong quá trình xảy ra tổng hợp mạch mới<span class='citation'>[cite: 2]</span>", "C. ADN ligase loại bỏ những đoạn ARN mồi trong giai đoạn kết thúc<span class='citation'>[cite: 2]</span>", "D. ADN polymerase III sửa sai và hoàn chỉnh mạch mới sau khi ARN bị loại bỏ<span class='citation'>[cite: 2]</span>"], correctIndex: 0, explanation: "Đáp án đúng là A<span class='citation'>[cite: 1]</span>." },
        { id: 70, text: "70. \\[H01.0045\\] Điều nào sau đây là sai về ống vi thể:<span class='citation'>[cite: 2]</span>", options: ["A. Chứa protein lamin, tham gia cấu tạo nên lamina của màng nhân<span class='citation'>[cite: 2]</span>", "B. Hình thành nên trung thể<span class='citation'>[cite: 2]</span>", "C. Tham gia quá trình vận tải nội bào<span class='citation'>[cite: 2]</span>", "D. Có thể biến mất nếu dùng tác nhân colchicin<span class='citation'>[cite: 2]</span>"], correctIndex: 0, explanation: "Đáp án đúng là A<span class='citation'>[cite: 1]</span>." },
        { id: 71, text: "71. \\[H01.0090\\] Về hiện tượng đa bội:<span class='citation'>[cite: 2]</span>", options: ["A. Thường gặp ở động vật hơn là thực vật<span class='citation'>[cite: 2]</span>", "B. Do NST không phân ly trong giảm phân<span class='citation'>[cite: 2]</span>", "C. Số lượng NST tăng hay giảm đi một hoặc một vài NST so với bộ NST lưỡng bội<span class='citation'>[cite: 2]</span>", "D. Do sự thụ tinh giữa các giao tử bất thường<span class='citation'>[cite: 2]</span>"], correctIndex: 3, explanation: "Đáp án đúng là D<span class='citation'>[cite: 1]</span>." },
        { id: 72, text: "72. \\[H01.0092\\] 48XXX,+15 là:<span class='citation'>[cite: 2]</span>", options: ["A. Thể ba kép<span class='citation'>[cite: 2]</span>", "B. Thể tam bội<span class='citation'>[cite: 2]</span>", "C. Thể khảm<span class='citation'>[cite: 2]</span>", "D. Thể tứ<span class='citation'>[cite: 2]</span>"], correctIndex: 0, explanation: "Đáp án đúng là A<span class='citation'>[cite: 1]</span>." },

        { id: 74, text: "74. \\[H01.0031\\] Về cấu trúc vi thể của NST:<span class='citation'>[cite: 2]</span>", options: ["A. Vệ tinh có ở nhánh ngắn của NST tâm lệch<span class='citation'>[cite: 2]</span>", "B. p=q là NST tâm lệch<span class='citation'>[cite: 2]</span>", "C. p&lt;q là NST tâm đầu<span class='citation'>[cite: 2]</span>", "D. Mỗi NST dạng kép gồm 2 chromatid được liên kết tại eo sơ cấp<span class='citation'>[cite: 2]</span>"], correctIndex: 3, explanation: "Đáp án đúng là D<span class='citation'>[cite: 1]</span>." },
        { id: 75, text: "75. \\[H01.0007\\] Sự tự động khép kín, tái hợp nhanh khi bị xé hay rách của màng kép lipid là do:<span class='citation'>[cite: 2]</span>", options: ["A. Sự tham gia của một số protein màng<span class='citation'>[cite: 2]</span>", "B. Do sự đổi chỗ linh hoạt theo chiều ngang của các phân tử lipid<span class='citation'>[cite: 2]</span>", "C. Sự glycolsyl hóa hình thành lớp áo tế bào vững chắc<span class='citation'>[cite: 2]</span>", "D. Tính chất giấu đầu kị nước khỏi nước hình thành một túi kín<span class='citation'>[cite: 2]</span>"], correctIndex: 3, explanation: "Đáp án đúng là D<span class='citation'>[cite: 1]</span>." },

        { id: 77, text: "77. \\[H01.0021\\] Mục đích chính của quá trình thuần thục hóa protein trong bộ Golgi là:<span class='citation'>[cite: 2]</span>", options: ["A. Để di chuyển dễ dàng từ phía cis tới miền trans.<span class='citation'>[cite: 2]</span>", "B. Tạo liên kết bền cho sản phẩm, bảo vệ sản phẩm<span class='citation'>[cite: 2]</span>", "C. Tạo tín hiệu dẫn đường và nhận diện địa chỉ nhận<span class='citation'>[cite: 2]</span>", "D. Tạo túi cầu bao chứa sản phẩm<span class='citation'>[cite: 2]</span>"], correctIndex: 2, explanation: "Đáp án đúng là C<span class='citation'>[cite: 1]</span>." },
        { id: 78, text: "78. \\[H01.0097\\] Đột biến cấu trúc NST:<span class='citation'>[cite: 2]</span>", options: ["A. Rối loạn cấu trúc kiểu chromatid do tác động vào NST ở pha G2<span class='citation'>[cite: 2]</span>", "B. Trao đổi chromatid thường gặp nhiểu ở người bình thường<span class='citation'>[cite: 2]</span>", "C. Đứt đơn ở chu kỳ tế bào trước có thể tạo ra một NST mất đoạn ở chu kỳ kế tiếp<span class='citation'>[cite: 2]</span>", "D. Rối loạn cấu trúc kiểu NST do tác động vào NST lúc đã nhân đôi<span class='citation'>[cite: 2]</span>"], correctIndex: 2, explanation: "Đáp án đúng là C<span class='citation'>[cite: 1]</span>." },
        { id: 79, text: "79. \\[H01.0108\\] Cho các sự kiện:<br>1. Chuyển vị<br>2. Mở đầu chuỗi polypeptid<br>3. Sự tạo thành cầu nối peptid<br>4. Hoạt hóa các acidamin<br>5. Kết thúc<br>6. Gắn aminoacyl-tARN vào vị trí A trên phân đơn vị lớn của ribosom<br>Thứ tự đúng cho một chuỗi sự kiện trong quá trình sinh tổng hợp protein:<span class='citation'>[cite: 2]</span>", options: ["A. 2, 4, 3, 1, 6, 5<span class='citation'>[cite: 2]</span>", "B. 4, 2, 6, 3, 1, 5<span class='citation'>[cite: 2]</span>", "C. 2, 4, 6, 1, 3, 5<span class='citation'>[cite: 2]</span>", "D. 4, 2, 1, 3, 6, 5<span class='citation'>[cite: 2]</span>"], correctIndex: 1, explanation: "Đáp án đúng là B<span class='citation'>[cite: 1]</span>." },
        { id: 80, text: "80. \\[H01.0093\\] Sự kiện không xảy ra trong quá trình tạo mARN thuần thục:<span class='citation'>[cite: 2]</span>", options: ["A. Hình thành thòng lọng intron và bị giáng cấp trong nhân<span class='citation'>[cite: 2]</span>", "B. Enzym ARN polymerase II nhận tín hiệu kết thúc, quá trình phiên mã dừng lại<span class='citation'>[cite: 2]</span>", "C. Đầu 5' của ARN tiền thân được gắn mũ 7 methyl guanozin triphotsphat nhằm bảo vệ bản sao ARN và tổng hợp protein sau này<span class='citation'>[cite: 2]</span>", "D. Đầu 3' được gắn đuôi polyA giúp mARN dễ dàng di chuyển ra bào tương và không bị phân hủy trong quá trình dịch mã<span class='citation'>[cite: 2]</span>"], correctIndex: 1, explanation: "Đáp án đúng là B<span class='citation'>[cite: 1]</span>." },
        { id: 81, text: "81. \\[H01.0036\\] Màng ty thể:<span class='citation'>[cite: 2]</span>", options: ["A. Màng ngoài có những nếp gấp thành các mào để tăng diện tích làm việc<span class='citation'>[cite: 2]</span>", "B. Màng trong có tỷ lệ P/L bằng 1<span class='citation'>[cite: 2]</span>", "C. Màng ngoài có tỷ lệ P/L bằng 2<span class='citation'>[cite: 2]</span>", "D. Có nhóm phức hợp protein làm nhiệm vụ vận tải viên ở cả 2 màng<span class='citation'>[cite: 2]</span>"], correctIndex: 3, explanation: "Đáp án đúng là D<span class='citation'>[cite: 1]</span>." },
        { id: 82, text: "82. \\[H01.0005\\] Nguyên nhân làm các phân tử protein màng phân bố đều nhau trên màng:<span class='citation'>[cite: 2]</span>", options: ["A. Chúng không có khả năng di động nên phân bố đồng đều được<span class='citation'>[cite: 2]</span>", "B. Sự liên kết của chúng với các photpholipid linh động<span class='citation'>[cite: 2]</span>", "C. Chúng xuyên qua màng 1 lần hoặc thậm chí 6-7 lần<span class='citation'>[cite: 2]</span>", "D. Lực tương tác giữa các phần thò ra phía ngoài màng<span class='citation'>[cite: 2]</span>"], correctIndex: 3, explanation: "Đáp án đúng là D<span class='citation'>[cite: 1]</span>." },

        { id: 85, text: "85. \\[H01.0035\\] Được coi như là một quá trình làm trong sạch tế bào:<span class='citation'>[cite: 2]</span>", options: ["A. Nội thực bào<span class='citation'>[cite: 2]</span>", "B. Thực bào<span class='citation'>[cite: 2]</span>", "C. Tự thực bào<span class='citation'>[cite: 2]</span>", "D. Ẩm bào<span class='citation'>[cite: 2]</span>"], correctIndex: 2, explanation: "Đáp án đúng là C<span class='citation'>[cite: 1]</span>." },

        { id: 96, text: "96. \\[H01.0102\\] Chuyển đoạn kiểu hòa nhập tâm:<span class='citation'>[cite: 2]</span>", options: ["A. Chỉ xảy ra với NST tâm giữa<span class='citation'>[cite: 2]</span>", "B. Thường không biểu hiện ở kiểu hình<span class='citation'>[cite: 2]</span>", "C. Không làm thay đổi số lượng NST<span class='citation'>[cite: 2]</span>", "D. Không làm mất vật chất di truyền của tế bào<span class='citation'>[cite: 2]</span>"], correctIndex: 1, explanation: "Đáp án đúng là B<span class='citation'>[cite: 1]</span>." },
        { id: 97, text: "97. \\[H01.0105\\] Về các dạng đột biến nucleotid và protein:<span class='citation'>[cite: 2]</span>", options: ["A. Đảo nucleotid là hiện tượng 2 nuleotid ở hai bộ ba khác nhau đổi chỗ cho nhau<span class='citation'>[cite: 2]</span>", "B. Nếu đột biến xảy ra tại gen cấu trúc thì các protein điều chỉnh sinh ra sẽ bị bất thường, khiến rối loạn việc kiểm soát sinh tổng hợp protein<span class='citation'>[cite: 2]</span>", "C. Thay thế nucleotid hay đảo nucleotid là 1 dạng của đột biến điểm<span class='citation'>[cite: 2]</span>", "D. Sự thay thế cùng loại nucleotid hiếm gặp hơn là sự thay thế khác loại<span class='citation'>[cite: 2]</span>"], correctIndex: 2, explanation: "Đáp án đúng là C<span class='citation'>[cite: 1]</span>." },
        { id: 98, text: "98. \\[H01.0083\\] Cấu trúc của ARN:<span class='citation'>[cite: 2]</span>", options: ["A. Các base nito nối với các phân tử đường ở cacbon thứ 2, khác với ở ADN là cacbon thứ nhất<span class='citation'>[cite: 2]</span>", "B. Giống với ADN ở liên kết diester trong chuỗi tạo bởi acid photphoric giữa 2 vị trí 3' và 5' của 2 phân tử đường cạnh nhau<span class='citation'>[cite: 2]</span>", "C. Cấu trúc bậc một chứa những đoạn ARN gấp khúc tạo nên hai chuỗi đơn nằm song song cạnh nhau và được liên kết với nhau bằng các cầu nối hydro theo nguyên tắc bổ sung<span class='citation'>[cite: 2]</span>", "D. Giống với ADN ở khung xương đường photphat<span class='citation'>[cite: 2]</span>"], correctIndex: 1, explanation: "Đáp án đúng là B<span class='citation'>[cite: 1]</span>." },
        { id: 99, text: "99. \\[H01.0014\\] Về chức năng của hệ lưới nội sinh chất nhẵn:<span class='citation'>[cite: 2]</span>", options: ["A. Chức năng giải độc<span class='citation'>[cite: 2]</span>", "B. Cả 3 ý trên<span class='citation'>[cite: 2]</span>", "C. Chứa enzim mang chức năng đặc biệt trong sự co duỗi cơ<span class='citation'>[cite: 2]</span>", "D. Tổng hợp và chuyển hóa acid béo và lipid nhờ hệ thống enzim bên trong màng<span class='citation'>[cite: 2]</span>"], correctIndex: 1, explanation: "Đáp án đúng là B<span class='citation'>[cite: 1]</span>." },
        { id: 100, text: "100. \\[H01.0058\\] Ý nghĩa của sự chết tế bào có chương trình:<span class='citation'>[cite: 2]</span>", options: ["A. Đóng góp vào hệ thống miễn dịch<span class='citation'>[cite: 2]</span>", "B. Xảy ra đồng thời với sự phân bào để làm hài hòa quá trình phát triển mô<span class='citation'>[cite: 2]</span>", "C. Phối hợp với sự phân bào đảm bào duy trì số lượng thích hợp tế bào<span class='citation'>[cite: 2]</span>", "D. Tất cả đều đúng<span class='citation'>[cite: 2]</span>"], correctIndex: 3, explanation: "Đáp án đúng là D<span class='citation'>[cite: 1]</span>." },
        { id: 101, text: "101. \\[H01.0052\\] Cộng bào:<span class='citation'>[cite: 2]</span>", options: ["A. Hình thành nên những tế bào không nhân, ví dụ như tế bào hồng cầu máu ngoại vi<span class='citation'>[cite: 2]</span>", "B. Do sự hợp nhất của nhiều tế bào<span class='citation'>[cite: 2]</span>", "C. Hình thành những tế bào đa nhân<span class='citation'>[cite: 2]</span>", "D. Có sự phân chia tế bào chất<span class='citation'>[cite: 2]</span>"], correctIndex: 2, explanation: "Đáp án đúng là C<span class='citation'>[cite: 1]</span>." },
        { id: 102, text: "102. \\[H01.0049\\] Cấu trúc siêu vi thể của NST không chỉ ra rằng:<span class='citation'>[cite: 2]</span>", options: ["A. Sợi chromatin được hình thành ngay trong pha G1 của sự phân bào nhờ các histon được tổng hợp từ tế bào chất di chuyển vào nhân cùng với ADN<span class='citation'>[cite: 2]</span>", "B. Sợi chromatid mảnh gồm chuỗi hạt nucleosom có phần lõi là 8 phân tử histon, cuốn quanh ADN sợi kép<span class='citation'>[cite: 2]</span>", "C. Dị nhiễm sắc là những đoạn NST vẫn còn kết đặc sau phân bào chứa ADN không hoạt động. Nhiễm sắc thực được hình thành từ đoạn ADN không lặp lại, là nơi có hoạt động di truyền<span class='citation'>[cite: 2]</span>", "D. Histon H1 có tính bảo thủ ít hơn các histon nucleosom<span class='citation'>[cite: 2]</span>"], correctIndex: 0, explanation: "Đáp án đúng là A<span class='citation'>[cite: 1]</span>." },
        { id: 103, text: "103. \\[H01.0017\\] Golgi là bào quan biệt hóa các loại màng của tế bào là do:<span class='citation'>[cite: 2]</span>", options: ["A. Tạo ra các túi có cấu tạo màng khác nhau, phù hợp với màng bào quan đích<span class='citation'>[cite: 2]</span>", "B. Quá trình thuần thục hóa định hướng địa chỉ giao nhận<span class='citation'>[cite: 2]</span>", "C. Góp phần tạo nên tiêu thể<span class='citation'>[cite: 2]</span>", "D. Đi từ miền cis tới trans, có đầy đủ tất cả các túi dẹt mang đặc trưng của các màng bào quan<span class='citation'>[cite: 2]</span>"], correctIndex: 0, explanation: "Đáp án đúng là A<span class='citation'>[cite: 1]</span>." },
        { id: 104, text: "104. \\[H01.0043\\] Về phân bào giảm nhiễm:<span class='citation'>[cite: 2]</span>", options: ["A. Xảy ra ở các tế bào sinh dục thuộc giai đoạn đầu của quá trình phát sinh giao tử<span class='citation'>[cite: 2]</span>", "B. Kết quả, từ tế bào lưỡng bội sang trạng thái đơn bội<span class='citation'>[cite: 2]</span>", "C. Không trải qua gian kỳ<span class='citation'>[cite: 2]</span>", "D. Gồm 2 lần phân bào liên tiếp, do đó ADN được nhân đôi 2 lần<span class='citation'>[cite: 2]</span>"], correctIndex: 1, explanation: "Đáp án đúng là B<span class='citation'>[cite: 1]</span>." },
        { id: 105, text: "105. \\[H01.0051\\] Hạch nhân:<span class='citation'>[cite: 2]</span>", options: ["A. Vùng sợi ít kết đặc chứa ADN hoạt động phiên mã<span class='citation'>[cite: 2]</span>", "B. Là nơi hình thành nên các phân đơn vị nhỏ và lớn của ribosom<span class='citation'>[cite: 2]</span>", "C. Được giới hạn bởi màng, có dạng hình quả bí đao<span class='citation'>[cite: 2]</span>", "D. Vùng sợi kết đặc chứa đựng những ribosom tử khi tiền thân cho tới khi trưởng thành<span class='citation'>[cite: 2]</span>"], correctIndex: 1, explanation: "Đáp án đúng là B<span class='citation'>[cite: 1]</span>." },
        { id: 106, text: "106. \\[H01.0027\\] Thành phần không tạo nên khung xương tế bào:<span class='citation'>[cite: 2]</span>", options: ["A. Ống vi thể<span class='citation'>[cite: 2]</span>", "B. Sợi trung gian<span class='citation'>[cite: 2]</span>", "C. Sợi vi thể<span class='citation'>[cite: 2]</span>", "D. Không bào<span class='citation'>[cite: 2]</span>"], correctIndex: 3, explanation: "Đáp án đúng là D<span class='citation'>[cite: 1]</span>." },
        { id: 107, text: "107. \\[H01.0025\\] Tính chất nửa tự trị của ty thể:<span class='citation'>[cite: 2]</span>", options: ["A. Ty thể có một phần số gen nhỏ của mình mã hóa cho protein riêng<span class='citation'>[cite: 2]</span>", "B. AND ty thể có vai trò chính trong di truyền dòng mẹ vì các ty thể của tinh trùng người không thể xâm nhập được vào noãn bào<span class='citation'>[cite: 2]</span>", "C. Ty thể hoàn toàn độc lập mà không có sự liên hệ nào với TB cũng như các bào quan khác<span class='citation'>[cite: 2]</span>", "D. Là ty thể mang chức năng hô hấp của tế bào, sản sinh năng lượng<span class='citation'>[cite: 2]</span>"], correctIndex: 0, explanation: "Đáp án đúng là A<span class='citation'>[cite: 1]</span>." },
        { id: 108, text: "108. \\[H01.0011\\] Về protein band3:<span class='citation'>[cite: 2]</span>", options: ["A. Vai trò quan trọng trong vận chuyển các phân tử lớn qua màng<span class='citation'>[cite: 2]</span>", "B. Tham gia vào việc gắn hệ lưới protein vào lớp lipid màng<span class='citation'>[cite: 2]</span>", "C. Có phần xuyên màng rất ngắn<span class='citation'>[cite: 2]</span>", "D. Rất đặc biệt vì không liên kết với các oligosaccarit trên bề mặt màng<span class='citation'>[cite: 2]</span>"], correctIndex: 1, explanation: "Đáp án đúng là B<span class='citation'>[cite: 1]</span>." },
        { id: 109, text: "109. \\[H01.0009\\] Nguyên nhân dễ di căn của tế bào ung thư:<span class='citation'>[cite: 2]</span>", options: ["A. Do chúng không tiết ra fibronectin<span class='citation'>[cite: 2]</span>", "B. Do chúng bám dính cơ chất<span class='citation'>[cite: 2]</span>", "C. Do chúng rất linh động nhờ lớp kép lipid<span class='citation'>[cite: 2]</span>", "D. Do chúng tiết ra fibronectin nhưng không giữ được nó trên bề mặt<span class='citation'>[cite: 2]</span>"], correctIndex: 3, explanation: "Đáp án đúng là D<span class='citation'>[cite: 1]</span>." },
        { id: 110, text: "110. \\[H01.0068\\] Vai trò chính của ARN polymerase II:<span class='citation'>[cite: 2]</span>", options: ["A. Tạo mARN tiền thân và mARN thuần thục<span class='citation'>[cite: 2]</span>", "B. Tạo vùng khởi đầu để enzym bám vào<span class='citation'>[cite: 2]</span>", "C. Tạo tín hiệu kết thúc quá trình phiên mã<span class='citation'>[cite: 2]</span>", "D. Tạo tARN tiền thân và rARN tiền thân<span class='citation'>[cite: 2]</span>"], correctIndex: 0, explanation: "Đáp án đúng là A<span class='citation'>[cite: 1]</span>." }
    ];

    let currentPool = [...allQuestions];
    let currentIndex = 0;
    let score = 0;
    let wrongQuestions = [];
    let isReviewMode = false;

    const domQuestionText = document.getElementById('question-text');
    const domOptionsContainer = document.getElementById('options-container');
    const domProgressText = document.getElementById('progress-text');
    const domScoreText = document.getElementById('score-text');
    const domExplanationBox = document.getElementById('explanation-box');
    const domExplanationText = document.getElementById('explanation-text');
    const btnNext = document.getElementById('btn-next');
    
    const screenQuestion = document.getElementById('question-screen');
    const screenResult = document.getElementById('result-screen');
    
    function initQuiz() {
        currentIndex = 0;
        score = 0;
        wrongQuestions = [];
        domScoreText.innerText = score;
        screenQuestion.style.display = 'block';
        screenResult.style.display = 'none';
        loadQuestion();
    }

    function loadQuestion() {
        const q = currentPool[currentIndex];
        
        domExplanationBox.style.display = 'none';
        btnNext.style.display = 'none';
        domOptionsContainer.innerHTML = '';
        
        const reviewLabel = isReviewMode ? "[Chế độ Ôn Tập] " : "";
        domProgressText.innerText = `${reviewLabel}Câu ${currentIndex + 1}/${currentPool.length}`;
        domQuestionText.innerHTML = q.text;

        q.options.forEach((opt, index) => {
            const btn = document.createElement('div');
            btn.className = 'option';
            btn.innerHTML = opt;
            btn.onclick = () => selectOption(index, btn);
            domOptionsContainer.appendChild(btn);
        });
    }

    function selectOption(selectedIndex, selectedElement) {
        const q = currentPool[currentIndex];
        const allOptions = domOptionsContainer.children;
        
        for(let i = 0; i < allOptions.length; i++) {
            allOptions[i].classList.add('disabled');
            allOptions[i].onclick = null;
        }

        const isCorrect = Array.isArray(q.correctIndex) ? q.correctIndex.includes(selectedIndex) : selectedIndex === q.correctIndex;

        if(isCorrect) {
            selectedElement.classList.add('correct');
            if(!isReviewMode) score++;
            domScoreText.innerText = score;
        } else {
            selectedElement.classList.add('wrong');
            if(Array.isArray(q.correctIndex)) {
                q.correctIndex.forEach(idx => allOptions[idx].classList.add('correct'));
            } else {
                allOptions[q.correctIndex].classList.add('correct');
            }
            
            if (!isReviewMode && !wrongQuestions.find(wq => wq.id === q.id)) {
                wrongQuestions.push(q);
            }
        }

        domExplanationText.innerHTML = q.explanation;
        domExplanationBox.style.display = 'block';
        
        btnNext.style.display = 'block';
        if(currentIndex === currentPool.length - 1) {
            btnNext.innerText = 'Xem kết quả ❯';
        } else {
            btnNext.innerText = 'Câu tiếp theo ❯';
        }
    }

    function nextQuestion() {
        if(currentIndex < currentPool.length - 1) {
            currentIndex++;
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        screenQuestion.style.display = 'none';
        screenResult.style.display = 'block';
        
        document.getElementById('final-score').innerText = score;
        document.getElementById('total-questions').innerText = currentPool.length;
        document.getElementById('final-wrong').innerText = isReviewMode ? "0 (Hoàn thành ôn tập)" : wrongQuestions.length;

        const btnReview = document.getElementById('btn-review');
        if(!isReviewMode && wrongQuestions.length > 0) {
            btnReview.style.display = 'block';
        } else {
            btnReview.style.display = 'none';
        }
    }

    function restartQuiz() {
        isReviewMode = false;
        currentPool = [...allQuestions];
        initQuiz();
    }

    function startReview() {
        if(wrongQuestions.length === 0) return;
        isReviewMode = true;
        currentPool = [...wrongQuestions];
        initQuiz();
    }

    initQuiz();
</script>
